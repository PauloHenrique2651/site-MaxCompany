<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>

<body>

      <div aria-hidden="true" class="loader-companies">
        <div class="loader-company loader-company-1">
          <img alt="" src="assets/maxplast.png"/>
        </div>
        <div class="loader-company loader-company-2">
          <img alt="" src="assets/maxsafety.png"/>
        </div>
        <div class="loader-company loader-company-3">
          <img alt="" src="assets/maxsupply.png"/>

  <!-- APLICAÇÃO -->
  <div class="app">

    <!-- LEITOR -->
    <main>
      <!-- ÁREA DO FLIPBOOK -->
      <section aria-label="Leitor do catálogo" class="reader">
        <div class="book-wrap">
          <div aria-label="Catálogo MaxCompany em formato flipbook" class="flipbook" id="flipbook" role="document"></div>
        </div>
      </section>
      <!-- MINIATURAS -->
      <aside aria-label="Miniaturas das páginas" class="thumbnails">
        <div class="thumb-list" id="thumbs"></div>
      </aside>
    </main>
  </div>
  <!-- JAVASCRIPT -->
  <script src="jquery.js"></script>
  <script src="turn.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

</html>
